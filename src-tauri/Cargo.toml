[package]
name = "clacket"
version = "0.2.0"
edition = "2021"
description = "Mechanical keyboard sounds while you type"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
chacha20 = "0.10"
getrandom = "0.4"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-format = { version = "0.7", default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3", "wav"] }
ed25519-dalek = "3"
data-encoding = "2"
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
flate2 = "1"
chacha20 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSHapticFeedback", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSAnimation"] }
io-kit-sys = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_TextServices", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
