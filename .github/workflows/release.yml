name: Release

# On every push to main, release-please keeps a "chore(main): release x.y.z" PR up to date with
# the next version and a changelog of the feat/fix commits since the last tag. Merging that PR
# tags vX.Y.Z, creates the GitHub Release, and the jobs below attach the installers to it.
on:
  push:
    branches: [main]
  # Rebuild and re-attach installers for an existing tag (e.g. after a failed build)
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # tags and releases
      pull-requests: write  # the release PR
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # upload installers to the release
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - run: cargo install tauri-cli --version "^2" --locked
      # macOS signing + notarization only when the secrets exist. Passing them empty makes
      # Tauri try to import an empty certificate and fail; without them it signs ad hoc.
      - name: Apple signing (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then echo "No Apple certificate: building an ad-hoc signed app."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!v}" ]]; then { echo "$v<<__END__"; echo "${!v}"; echo "__END__"; } >> "$GITHUB_ENV"; fi
          done
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          projectPath: src-tauri
          tagName: ${{ env.TAG }}
          releaseDraft: false
          args: ${{ matrix.args }}

  deploy-worker:
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.cf.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          preCommands: npx wrangler d1 migrations apply clacket-license --remote
          command: deploy

  # After the installers are attached, rebuild clacket.th33raphat.dev so its download
  # buttons serve the new version (the repo is private, so the site hosts the files).
  deploy-site:
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read  # gh release download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build site
        if: steps.cf.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-site.sh
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.cf.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
